name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ubuntu-latest ships Google Chrome pre-installed; WebDriverManager matches the driver to it.
      # set -o pipefail is required here: without it, "mvn ... | tee" always exits 0 (tee's own
      # exit code), which would report this step - and the whole job - as successful even when
      # tests fail, silently breaking job.status for the Slack notification below.
      - name: Run Selenium test suite (headless)
        run: |
          set -o pipefail
          mvn -B test -Dheadless=true 2>&1 | tee test-output.log

      # Always upload raw results as a build artifact - the reliable path for grading/review,
      # independent of whether GitHub Pages is enabled on this repo.
      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      # Pulls forward the previous report's trend data so the new report's history/duration
      # graphs build up across builds instead of resetting to a single point every run.
      - name: Fetch previous report history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Seed history into Allure results
        if: always()
        run: |
          mkdir -p target/allure-results/history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/. target/allure-results/history/
          fi

      # Uses the allure-maven plugin already declared in pom.xml
      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin

      # Builds the whole Slack payload as one JSON value with jq rather than
      # static YAML, since the number of "failed test" cards varies per run
      - name: Summarize test run
        if: always()
        id: summary
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          JOB_STATUS: ${{ job.status }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR_NAME: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          elapsed_secs=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          elapsed=$(printf '%dm %ds' $((elapsed_secs / 60)) $((elapsed_secs % 60)))
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          report_url="https://${REPO_OWNER}.github.io/${REPO_NAME}/"
          commit_url="${COMMIT_URL:-$PR_URL}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            subject="$PR_TITLE"
            trigger_label="pull request"
          else
            subject=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
            trigger_label="push"
          fi

          if [ -f target/surefire-reports/testng-results.xml ]; then
            xml=$(grep -o '<testng-results[^>]*>' target/surefire-reports/testng-results.xml | head -1)
            total=$(echo "$xml" | grep -oP 'total="\K[0-9]+' || echo 0)
            passed=$(echo "$xml" | grep -oP 'passed="\K[0-9]+' || echo 0)
            failed=$(echo "$xml" | grep -oP 'failed="\K[0-9]+' || echo 0)
            skipped=$(echo "$xml" | grep -oP 'skipped="\K[0-9]+' || echo 0)
            retried=$(echo "$xml" | grep -oP 'retried="\K[0-9]+' || echo 0)
            if [ "$total" -gt 0 ]; then
              pass_rate=$(awk "BEGIN { printf \"%.1f\", ($passed/$total)*100 }")
            else
              pass_rate="0.0"
            fi
          else
            total=0; passed=0; failed=0; skipped=0; retried=0; pass_rate="0.0"
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            status_color="#2eb67d"
            header_text="✅ CI Pipeline Passed"
          else
            status_color="#e01e5a"
            if [ "$total" -eq 0 ]; then
              header_text="🔴 CI Pipeline Failed, build error before tests ran"
            else
              header_text="🔴 CI Pipeline Failed, ${failed} test(s) need attention"
            fi
          fi

          # Build the failed-test cards from testng-results.xml: the @Test description (or the
          # method name if no description is set) becomes the bold title, and the first line of
          # the exception message, trimmed to 120 chars, becomes the one-line detail. Capped at
          # 5 cards; any beyond that are summarised in an overflow note so the Slack message
          # always renders in full without a "see more" cut-off.
          overflow_note=""
          if [ -f target/surefire-reports/testng-results.xml ]; then
            failed_json=$(python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          try:
              root = ET.parse("target/surefire-reports/testng-results.xml").getroot()
          except Exception:
              print("[]"); raise SystemExit
          cards = []
          for m in root.iter("test-method"):
              if m.get("status") == "FAIL" and m.get("is-config") != "true":
                  title = m.get("description") or m.get("name")
                  detail = ""
                  exc = m.find("exception")
                  if exc is not None:
                      msg = (exc.findtext("message") or "").strip()
                      detail = msg.splitlines()[0][:120] if msg else (exc.get("class") or "")
                  cards.append({"title": title, "detail": detail})
          print(json.dumps(cards))
          PY
          )
            total_failed=$(echo "$failed_json" | jq 'length')
            shown_json=$(echo "$failed_json" | jq -c '.[:5]')
            if [ "$total_failed" -gt 5 ]; then
              overflow_note="and $((total_failed - 5)) more, see the full report"
            fi
            failed_json="$shown_json"
          else
            failed_json="[]"
          fi

          payload=$(jq -n -c \
            --arg status_color "$status_color" --arg header_text "$header_text" \
            --arg repo_name "$REPO_NAME" --arg branch "$BRANCH_NAME" \
            --arg short_sha "$short_sha" --arg subject "$subject" \
            --arg actor "$ACTOR_NAME" --arg trigger_label "$trigger_label" \
            --arg passed "$passed" --arg failed "$failed" --arg skipped "$skipped" --arg retried "$retried" \
            --arg total "$total" --arg pass_rate "$pass_rate" --arg elapsed "$elapsed" \
            --arg report_url "$report_url" --arg run_url "$RUN_URL" --arg commit_url "$commit_url" \
            --arg jira_url "https://amali-tech.atlassian.net/secure/CreateIssue.jspa" \
            --arg run_number "$RUN_NUMBER" \
            --arg overflow_note "$overflow_note" \
            --argjson failed_tests "$failed_json" \
            '
            def mrkdwn: {type: "mrkdwn", text: .};
            def field($label; $value): ("*" + $label + "*\n" + $value) | mrkdwn;
            {
              attachments: (
                [{
                  color: $status_color,
                  blocks: [
                    {type: "header", text: {type: "plain_text", text: $header_text, emoji: true}},
                    {type: "context", elements: [("Selenium WebDriver + TestNG regression suite" | mrkdwn)]},
                    {type: "divider"},
                    {type: "section", fields: [field("Repository"; "`" + $repo_name + "`"), field("Branch"; "`" + $branch + "`")]},
                    {type: "divider"},
                    {type: "section", fields: [field("Commit"; "`" + $short_sha + "` " + $subject), field("Triggered by"; $actor + ", " + $trigger_label)]},
                    {type: "divider"},
                    {type: "section", fields: [
                      field("Passed"; $passed), field("Failed"; $failed),
                      field("Skipped"; $skipped), field("Retried"; $retried)
                    ]},
                    {type: "context", elements: [($total + " tests total, " + $pass_rate + "% pass rate, duration " + $elapsed | mrkdwn)]}
                  ]
                }]
                + (if ($failed_tests | length) > 0 then
                    [{color: "#e01e5a", blocks: [{type: "section", text: ("*Failed tests*" | mrkdwn)}]}]
                  else [] end)
                + [$failed_tests[] | {
                    color: "#e01e5a",
                    blocks: [{type: "section", text: (("*" + .title + "*") | mrkdwn)}]
                  }]
                + (if $overflow_note != "" then
                    [{color: "#e01e5a", blocks: [{type: "context", elements: [($overflow_note | mrkdwn)]}]}]
                  else [] end)
                + [{
                    color: $status_color,
                    blocks: [
                      {type: "actions", elements: [
                        {type: "button", text: {type: "plain_text", text: "View Report", emoji: true}, style: "primary", url: $report_url},
                        {type: "button", text: {type: "plain_text", text: "View Run", emoji: true}, url: $run_url},
                        {type: "button", text: {type: "plain_text", text: "View Commit", emoji: true}, url: $commit_url},
                        {type: "button", text: {type: "plain_text", text: "Create Jira Issue", emoji: true}, url: $jira_url}
                      ]},
                      {type: "divider"},
                      {type: "context", elements: [("GitHub Actions · Build " + $run_number + " · Chrome headless · Java 17" | mrkdwn)]}
                    ]
                  }]
              )
            }
            '
          )
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Notify Slack of build status
        if: always()
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.summary.outputs.payload }}