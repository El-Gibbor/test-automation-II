name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ubuntu-latest ships Google Chrome pre-installed; WebDriverManager matches the driver to it.
      # Piped through tee so "Summarize test run" can pull failure detail out of the same output;
      # GitHub Actions' default bash runs with pipefail, so a test failure still fails this step.
      - name: Run Selenium test suite (headless)
        run: mvn -B test -Dheadless=true 2>&1 | tee test-output.log

      # Always upload raw results as a build artifact - the reliable path for grading/review,
      # independent of whether GitHub Pages is enabled on this repo.
      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      # Pulls forward the previous report's trend data so the new report's history/duration
      # graphs build up across builds instead of resetting to a single point every run.
      - name: Fetch previous report history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Seed history into Allure results
        if: always()
        run: |
          mkdir -p target/allure-results/history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/. target/allure-results/history/
          fi

      # Uses the allure-maven plugin already declared in pom.xml - a plain Maven goal, no
      # third-party Docker action required (that's what broke the previous report step).
      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin

      - name: Summarize test run
        if: always()
        id: summary
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          echo "elapsed=$(printf '%dm %ds' $((elapsed / 60)) $((elapsed % 60)))" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            subject="$PR_TITLE"
          else
            subject=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          fi
          echo "commit_subject=$subject" >> "$GITHUB_OUTPUT"

          if [ -f target/surefire-reports/testng-results.xml ]; then
            xml=$(grep -o '<testng-results[^>]*>' target/surefire-reports/testng-results.xml | head -1)
            total=$(echo "$xml" | grep -oP 'total="\K[0-9]+' || echo 0)
            passed=$(echo "$xml" | grep -oP 'passed="\K[0-9]+' || echo 0)
            failed=$(echo "$xml" | grep -oP 'failed="\K[0-9]+' || echo 0)
            skipped=$(echo "$xml" | grep -oP 'skipped="\K[0-9]+' || echo 0)
            retried=$(echo "$xml" | grep -oP 'retried="\K[0-9]+' || echo 0)
            if [ "$total" -gt 0 ]; then
              pass_rate=$(awk "BEGIN { printf \"%.1f\", ($passed/$total)*100 }")
            else
              pass_rate="0.0"
            fi
          else
            total=0; passed=0; failed=0; skipped=0; retried=0; pass_rate="0.0"
          fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "retried=$retried" >> "$GITHUB_OUTPUT"
          echo "pass_rate=$pass_rate" >> "$GITHUB_OUTPUT"

          if [ -f test-output.log ]; then
            failed_tests=$(grep -oP '^\[ERROR\]   \K.*' test-output.log | head -5 | sed 's/$/\\n/' | tr -d '\n')
          else
            failed_tests=""
          fi
          echo "failed_tests=$failed_tests" >> "$GITHUB_OUTPUT"

      - name: Notify Slack of build status
        if: always()
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            attachments:
              - color: "${{ job.status == 'success' && '#2eb67d' || '#e01e5a' }}"
                blocks:
                  - type: "header"
                    text:
                      type: "plain_text"
                      text: "${{ job.status == 'success' && '✅ CI Pipeline Passed' || (steps.summary.outputs.total == '0' && '🔴 CI Pipeline Failed, build error before tests ran' || format('🔴 CI Pipeline Failed, {0} test(s) failing', steps.summary.outputs.failed)) }}"
                      emoji: true
                  - type: "context"
                    elements:
                      - type: "mrkdwn"
                        text: "Selenium WebDriver + TestNG regression suite"
                  - type: "divider"
                  - type: "section"
                    fields:
                      - type: "mrkdwn"
                        text: "*Repository*\n`${{ github.event.repository.name }}`"
                      - type: "mrkdwn"
                        text: "*Branch*\n`${{ github.ref_name }}`"
                      - type: "mrkdwn"
                        text: "*Commit*\n`${{ steps.summary.outputs.short_sha }}` ${{ steps.summary.outputs.commit_subject }}"
                      - type: "mrkdwn"
                        text: "*Triggered by*\n${{ github.actor }}, ${{ github.event_name == 'push' && 'push' || 'pull request' }}"
                  - type: "divider"
                  - type: "section"
                    text:
                      type: "mrkdwn"
                      text: "*Test Results*\n✅ Passed: ${{ steps.summary.outputs.passed }}\n❌ Failed: ${{ steps.summary.outputs.failed }}\n⏭️ Skipped: ${{ steps.summary.outputs.skipped }}\n🔁 Retried: ${{ steps.summary.outputs.retried }}\n📊 Total: ${{ steps.summary.outputs.total }}\n⏱️ Duration: ${{ steps.summary.outputs.elapsed }}\n*Pass rate:* ${{ steps.summary.outputs.pass_rate }}%"
                  - type: "divider"
                  - type: "section"
                    text:
                      type: "mrkdwn"
                      text: "${{ steps.summary.outputs.failed == '0' && (steps.summary.outputs.total == '0' && '⚠️ No test report was generated, check the run logs.' || '✅ No failures on this run.') || format('*Failed tests*\n{0}', steps.summary.outputs.failed_tests) }}"
                  - type: "divider"
                  - type: "actions"
                    elements:
                      - type: "button"
                        text:
                          type: "plain_text"
                          text: "🧪 View Report"
                          emoji: true
                        style: "primary"
                        url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
                      - type: "button"
                        text:
                          type: "plain_text"
                          text: "🏃 View Run"
                          emoji: true
                        url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      - type: "button"
                        text:
                          type: "plain_text"
                          text: "🌿 View Commit"
                          emoji: true
                        url: "${{ github.event.head_commit.url || github.event.pull_request.html_url }}"
                      - type: "button"
                        text:
                          type: "plain_text"
                          text: "🐛 Create Jira Issue"
                          emoji: true
                        url: "https://amali-tech.atlassian.net/secure/CreateIssue.jspa"
                  - type: "divider"
                  - type: "context"
                    elements:
                      - type: "mrkdwn"
                        text: "GitHub Actions · Build ${{ github.run_number }} · Chrome headless · Java 17"
