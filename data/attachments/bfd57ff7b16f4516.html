<html><head><style type="text/css">@charset "UTF-8";[ng\:cloak],[ng-cloak],[data-ng-cloak],[x-ng-cloak],.ng-cloak,.x-ng-cloak,.ng-hide:not(.ng-hide-animate){display:none !important;}ng\:form{display:block;}.ng-animate-shim{visibility:hidden;}.ng-anchor{position:absolute;}</style>

	<title>XYZ Bank</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css">
</head>

<body ng-app="BankApp" ng-controller="bodyCtrl" style="background:#e8e8e8;" class="ng-scope">
	<!-- uiView:  --><div ui-view="" class="ng-scope"><div class="container-fluid ng-scope">
	<div class="box mainhdr">
		<button class="btn home" ng-click="home()">Home</button>
		<strong class="mainHeading">XYZ Bank</strong>
		<button ng-show="logout" class="btn logout" ng-click="byebye()">Logout</button>
		
	</div>
	<!-- uiView:  --><div ui-view="" class="ng-scope"><div class="marTop tbStruct border box ng-scope">
	<div class="fixedTopBox">
	<button style="float:left" class="btn" ng-click="back()">Back</button>
	<div ng-show="showDate" style="margin-left:20%;">
		<input style="width:130px;" type="datetime-local" id="start" name="start" ng-model="startDate" placeholder="yyyy-MM-ddTHH:mm:ss" min="2026-09-08T19:03:05" max="2026-09-08T19:03:05" required="" class="ng-pristine ng-untouched ng-valid-min ng-valid-required ng-invalid ng-invalid-max">
		<input style="width:130px;" type="datetime-local" id="end" name="end" ng-model="end" placeholder="yyyy-MM-ddTHH:mm:ss" min="2026-09-08T19:03:05" max="2026-09-08T19:03:05" required="" class="ng-pristine ng-untouched ng-valid-min ng-valid-required ng-invalid ng-invalid-max">
  
<!-- 		<input style="border:1px solid black;width:80px;" id="start" type="text" date-time name="input1" ng-model="start" min-view="date" max-view="date" auto-close="true" readOnly />
 		<input style="border:1px solid black;width:80px;" id="end" type="datetime" name="input2" date-time ng-model="end" min-view="date" max-view="date" auto-close="true" readOnly/> -->
	</div>
	<button ng-show="showDate" class="btn" style="float:right;margin-top:-30px;" ng-click="reset()">Reset</button>
	</div>

<div style="height:300px;">
	<div style="height:70px" id="anchor"></div>
	<table class="table table-bordered table-striped">
    
    <thead>
      <tr>
        <td>
          <a href="#" ng-click="sortType = 'date'; sortReverse = !sortReverse">
            Date-Time
          </a>
        </td>
        <td><a>Amount</a></td>
        <td><a>Transaction Type</a></td>
      </tr>
    </thead>
    
    <tbody>
    	
	
      <!-- ngRepeat: tx in transactions | orderBy:sortType:sortReverse | sDate:startDate:end -->
    </tbody>
    
  </table>
</div>
<div ng-show="showDate" class="fixedBottomBox" style="margin-top:58px;">
<button class="btn btn-primary ng-hide" style="float:left" ng-show="left" ng-click="scrollLeft()">&lt;</button>
<button class="btn btn-primary ng-hide" style="margin-left:40%" ng-show="left" ng-click="scrollTop()">Top</button>
<button class="btn btn-primary" style="float:right" ng-show="right" ng-click="scrollRight()">&gt;</button>
</div>
</div>

</div>

</div></div>

	<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.4.7/angular.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/0.2.15/angular-ui-router.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js"></script>
	
	<script type="text/javascript" src="app.js"></script>
	<script type="text/javascript" src="user.service.js"></script>
	<script type="text/javascript" src="account.service.js"></script>
	<script type="text/javascript" src="transaction.service.js"></script>
	<script type="text/javascript" src="mockDataLoadService.js"></script>
	<script type="text/javascript" src="customer.data.js"></script>
	<script type="text/javascript" src="config.js"></script>
	<script type="text/javascript" src="date.search.filter.js"></script>
	<script type="text/javascript" src="accountViewController.js"></script>
	<script type="text/javascript" src="addCustomerController.js"></script>
	<script type="text/javascript" src="customerViewController.js"></script>
	<script type="text/javascript" src="bodyController.js"></script>
	<script type="text/javascript" src="depositController.js"></script>
	<script type="text/javascript" src="listCustomerController.js"></script>
	<script type="text/javascript" src="mainController.js"></script>
	<script type="text/javascript" src="managerViewController.js"></script>
	<script type="text/javascript" src="openAccountController.js"></script>
	<script type="text/javascript" src="optionsController.js"></script>
	<script type="text/javascript" src="transactionSummaryController.js"></script>
	<script type="text/javascript" src="withdrawlController.js"></script>



    </body></html>
